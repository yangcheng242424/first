<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="手机端Cursor控制演示 - 展示如何在手机上使用Cursor进行编程">
    <title>手机端Cursor控制演示</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1>📱 Cursor 手机端控制</h1>
            <div class="status-indicator">
                <span class="status-dot active"></span>
                <span>已连接</span>
            </div>
        </header>

        <!-- 主要功能区域 -->
        <main class="main-content">
            <!-- 代码编辑器区域 -->
            <section class="code-section">
                <div class="section-header">
                    <h2>代码编辑器</h2>
                    <div class="toolbar">
                        <button class="btn-icon" id="runBtn" title="运行代码">▶️</button>
                        <button class="btn-icon" id="saveBtn" title="保存">💾</button>
                        <button class="btn-icon" id="formatBtn" title="格式化">✨</button>
                    </div>
                </div>
                <div class="code-editor-wrapper">
                    <textarea id="codeEditor" class="code-editor" placeholder="在这里输入代码...&#10;&#10;提示：&#10;- 使用语音输入可以快速输入代码&#10;- 长按可以显示更多选项&#10;- 双指缩放可以调整字体大小"></textarea>
                    <div class="editor-line-numbers" id="lineNumbers"></div>
                </div>
                <div class="editor-footer">
                    <span class="language-selector">
                        <select id="languageSelect">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                        </select>
                    </span>
                    <span class="char-count">字符数: <span id="charCount">0</span></span>
                </div>
            </section>

            <!-- 快捷操作面板 -->
            <section class="quick-actions">
                <h2>快捷操作</h2>
                <div class="action-grid">
                    <button class="action-btn" data-action="voice">
                        <span class="action-icon">🎤</span>
                        <span class="action-label">语音输入</span>
                    </button>
                    <button class="action-btn" data-action="ai">
                        <span class="action-icon">🤖</span>
                        <span class="action-label">AI助手</span>
                    </button>
                    <button class="action-btn" data-action="search">
                        <span class="action-icon">🔍</span>
                        <span class="action-label">代码搜索</span>
                    </button>
                    <button class="action-btn" data-action="git">
                        <span class="action-icon">📦</span>
                        <span class="action-label">Git操作</span>
                    </button>
                    <button class="action-btn" data-action="terminal">
                        <span class="action-icon">💻</span>
                        <span class="action-label">终端</span>
                    </button>
                    <button class="action-btn" data-action="files">
                        <span class="action-icon">📁</span>
                        <span class="action-label">文件管理</span>
                    </button>
                </div>
            </section>

            <!-- 手势控制说明 -->
            <section class="gesture-guide">
                <h2>手势控制</h2>
                <div class="gesture-list">
                    <div class="gesture-item">
                        <span class="gesture-icon">👆</span>
                        <div class="gesture-info">
                            <strong>单击</strong>
                            <p>选择/点击</p>
                        </div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">👆👆</span>
                        <div class="gesture-info">
                            <strong>双击</strong>
                            <p>选中单词</p>
                        </div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">👆👆👆</span>
                        <div class="gesture-info">
                            <strong>三击</strong>
                            <p>选中整行</p>
                        </div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">🤏</span>
                        <div class="gesture-info">
                            <strong>双指缩放</strong>
                            <p>调整字体大小</p>
                        </div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">👆长按</span>
                        <div class="gesture-info">
                            <strong>长按</strong>
                            <p>显示上下文菜单</p>
                        </div>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-icon">👈👉</span>
                        <div class="gesture-info">
                            <strong>左右滑动</strong>
                            <p>撤销/重做</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 输出控制台 -->
            <section class="console-section">
                <div class="section-header">
                    <h2>输出控制台</h2>
                    <button class="btn-clear" id="clearConsole">清空</button>
                </div>
                <div id="console" class="console"></div>
            </section>
        </main>

        <!-- 底部工具栏 -->
        <footer class="footer">
            <button class="footer-btn" id="menuBtn">
                <span>☰</span>
                <span>菜单</span>
            </button>
            <button class="footer-btn" id="keyboardBtn">
                <span>⌨️</span>
                <span>键盘</span>
            </button>
            <button class="footer-btn" id="settingsBtn">
                <span>⚙️</span>
                <span>设置</span>
            </button>
        </footer>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- 通知提示 -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
